# @package _global_

defaults:
  - override /model: aafm.yaml
  - override /env: atsp.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: wandb.yaml

env:
  generator_params:
    num_loc: 100

logger:
  wandb:
    project: "rr-nco"
    tags: ["aafm", "atsp"]
    group: "atsp100"
    name: "aafm-atsp100"

model:
  policy:
    _target_: "rrnco.baselines.AAFM.atsp_model.AAFMATSPPolicy"
    env_name: "atsp"
    embed_dim: 128
    num_encoder_layers: 6
    neighbors: 20
  batch_size: 16
  train_data_size: 25_000
  val_data_size: 1280
  test_data_size: 1280
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-6
  lr_scheduler:
    "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [180, 195]
    gamma: 0.1

trainer:
  max_epochs: 200

seed: 1234
